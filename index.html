<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EFF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1215" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Gym-Bro</title>
<script src="profile.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app. Sticky status header, stacked exercise cards, fixed bottom tab bar, rest timer docked above it. Plate colours as the only flourish. */
:root{
  --bg:#EFF1EF; --surface:#FFFFFF; --sunk:#E4E8E5; --line:#D3D9D5;
  --fg:#14181B; --muted:#58626A; --accent:#1D4E9E; --accent-ink:#FFFFFF; --accent-soft:#DDE6F4;
  --plate:#C22D29; --plate-ink:#FFFFFF; --ok:#1C7248; --ok-soft:#DCEFE4; --warn:#94580A; --warn-soft:#F6EAD6;
  --display:"Barlow Condensed","Arial Narrow",Impact,system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1215; --surface:#171C20; --sunk:#1F262B; --line:#2B3339;
  --fg:#E8ECEA; --muted:#9AA3A9; --accent:#7AA5EE; --accent-ink:#0E1215; --accent-soft:#1D2A40;
  --plate:#EE625C; --plate-ink:#160A09; --ok:#56C590; --ok-soft:#173226; --warn:#E6A74A; --warn-soft:#352817;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1215; --surface:#171C20; --sunk:#1F262B; --line:#2B3339;
  --fg:#E8ECEA; --muted:#9AA3A9; --accent:#7AA5EE; --accent-ink:#0E1215; --accent-soft:#1D2A40;
  --plate:#EE625C; --plate-ink:#160A09; --ok:#56C590; --ok-soft:#173226; --warn:#E6A74A; --warn-soft:#352817;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num,input[type=number]{font-variant-numeric:tabular-nums}
.shell{max-width:560px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .shell{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--display);font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;flex-shrink:0}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
main.shell{padding-block:16px 150px;display:flex;flex-direction:column;gap:14px}
h1.day{font-family:var(--display);font-weight:700;font-size:40px;line-height:.95;text-transform:uppercase;margin:0;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);margin:4px 0 0}
h2.sec{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin:10px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-head h3{margin:0;font-size:16.5px;font-weight:700;line-height:1.25}
.ex-meta{color:var(--muted);font-size:13px;margin-top:2px}
.target{font-family:var(--display);font-size:20px;font-weight:700;white-space:nowrap;line-height:1}
.last{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;letter-spacing:.02em}
.chip.plate{background:var(--plate);color:var(--plate-ink)}
.chip.plate::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--plate-ink);opacity:.9;box-shadow:inset 0 0 0 2px var(--plate)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.mrow .both{display:block;font-style:normal;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:none;color:var(--accent)}
.pack{color:var(--muted);font-size:12px;white-space:nowrap}
.target small{display:block;font:600 12px var(--body);letter-spacing:0;text-transform:none;text-align:right}
.uni{margin:0;font-size:14px}
.rs-h{display:flex;gap:8px;align-items:baseline;margin-bottom:2px}
.rs-h b{font-size:15px}
.rs-h i{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:1px 8px}
.rs-h i.who-chef{background:var(--plate);color:var(--plate-ink)}
.rs-h i.who-helper{background:var(--accent-soft);color:var(--accent)}
.rs-h em{font-style:normal;font-size:12px;color:var(--muted);margin-left:auto}
.rs-ready{display:block;font-size:12.5px;font-weight:600;color:var(--ok)}
.check.rs i{color:var(--muted)}
.chip.dt-fresh{background:var(--ok-soft);color:var(--ok)}
.chip.dt-head{background:var(--warn-soft);color:var(--warn)}
.chip.dt-sunday{background:var(--plate);color:var(--plate-ink)}
.chip.muted{background:var(--sunk);color:var(--muted)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:40px 1fr auto 1fr 44px;align-items:center;gap:6px}
.set .n{font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.set input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:9px;padding:9px 8px;font:600 16px var(--body);text-align:center}
.set .x{color:var(--muted);font-size:12px}
.set label{position:relative;display:block;min-width:0}
.set label small{position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
.tick{height:40px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:18px;display:grid;place-items:center}
.set.done input{border-color:var(--ok);background:var(--ok-soft)}
.set.done .tick{background:var(--ok);border-color:var(--ok);color:var(--surface)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rest-note{font-size:12.5px;color:var(--muted)}
.meal{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meal p{margin:1px 0 0}
.meal .k{text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.box{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--surface);font-size:14px;margin-top:2px}
.box[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.totals{display:flex;gap:10px;flex-wrap:wrap}
.meter{flex:1 1 140px;min-width:0}
.meter .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.meter .row b{color:var(--fg);font-size:15px}
.bar{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.rest-card{text-align:left}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.strip button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:8px 2px;cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.strip button b{font-family:var(--display);font-size:18px;text-transform:uppercase}
.strip button span{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.strip button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.strip button[aria-pressed="true"] span{color:var(--accent-ink);opacity:.85}
.strip button.today{box-shadow:inset 0 -3px 0 var(--plate)}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list li span:last-child{color:var(--muted);white-space:nowrap}
.check{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;padding:7px 0;cursor:pointer}
.check.on span{color:var(--muted);text-decoration:line-through}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{color:var(--accent);font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface);font-size:14px}
.form{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.form input{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:9px;padding:9px 8px;font:600 15px var(--body);width:100%;min-width:0}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font:700 15px var(--body);padding:11px 14px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:7px 11px;font-size:13px}
.chart svg{width:100%;height:auto;display:block}
.cp{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.cp:first-of-type{border-top:0}
.cp .w{font-family:var(--display);font-size:20px;font-weight:700;white-space:nowrap}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 6px 6px 0}
.tbl td{padding:8px 6px 8px 0;border-top:1px solid var(--line)}
.banner{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.banner b{color:var(--accent)}
.empty{color:var(--muted);font-size:14px;margin:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .shell{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:10px 0 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
#timer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6}
#timer .shell{padding-block:0 8px}
#ktimers{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6}
#ktimers .shell{padding-block:0 8px}
#ktimers .kt{background:var(--fg);color:var(--bg);border-radius:12px;padding:4px 6px 4px 12px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:13px}
#ktimers button{border:0;background:transparent;color:inherit;font:700 13px var(--body);padding:8px;cursor:pointer}
#ktimers .kt-open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:4px 0;text-align:left;font-weight:500}
#ktimers .kt-open b{font-family:var(--display);font-size:22px;min-width:56px}
#ktimers .kt-open span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ktimers .kt-open em{font-style:normal;font-weight:700;opacity:.75;white-space:nowrap}
#ktimers .kt.done{background:var(--warn);color:#fff}
.kt-row .opt-top b{font-family:var(--display);font-size:24px}
body.has-kt main{padding-bottom:132px}
.rs-timer{display:block;font-size:12.5px;color:var(--muted)}
#timer .in{background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#timer .t{font-family:var(--display);font-size:30px;font-weight:700;min-width:70px}
#timer .lb{flex:1;min-width:0;font-size:13px}
#timer .tb{height:4px;background:rgba(127,127,127,.35);border-radius:9px;margin-top:5px;overflow:hidden}
#timer .tb i{display:block;height:100%;background:var(--plate)}
#timer button{border:0;background:transparent;color:var(--bg);font:700 13px var(--body);padding:8px;cursor:pointer;opacity:.85}
#timer.go .in{background:var(--ok);color:var(--surface)}
.sync{font-size:12px;color:var(--muted)}
.data-btns{display:flex;flex-wrap:wrap;gap:8px}
#q-msg:empty,#sh-msg:empty,#shop-msg:empty,#m-msg:empty{display:none}
.missed{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.missed summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px}
.missed[open] summary{margin-bottom:8px}
.pl{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--fg);font-weight:400}
.pl li b{font-weight:700}
.pl .plh{list-style:none;margin:4px 0 0 -18px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.check.on .pl{opacity:.55}
.check.on span .pl{text-decoration:none}
.prep-est{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.prep-est b{font-family:var(--display);font-size:26px;text-transform:uppercase}
.prep-est span{color:var(--muted);font-size:13px}
.pd{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.45}
.check.on .pd{text-decoration:line-through}
.onday{flex-basis:100%;font-size:12.5px;color:var(--muted)}
.onday::before{content:"On the day: ";font-weight:700}
.onday.nolabel::before{content:none}
.supp .meal{grid-template-columns:28px 1fr 0}
.supp .wrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.share-ta{width:100%;min-height:140px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);font:13px ui-monospace,monospace;padding:8px}
#sh-load{align-self:flex-start}
.seg.wide{display:flex}
.seg.wk button{padding:9px 12px;font-size:14px}
.seg.wide button{flex:1}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.share{gap:12px}
.share textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);font:13px ui-monospace,monospace;padding:8px}
.share-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,180px);gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.share-row b{display:block}
.share-row small{display:block;font-size:12.5px;color:var(--muted)}
.goal{margin:2px 0 0;font-size:14px;color:var(--muted)}
.goal b{color:var(--accent)}
@media (max-width:420px){.share-row{grid-template-columns:1fr}}
.weigh .wrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.done-weigh{padding-block:10px}
.done-weigh .wrow{align-items:center;font-size:14px}
.form input:disabled{opacity:.7}
.wstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wstats div{display:flex;flex-direction:column;gap:2px;min-width:0}
.wstats span{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.wstats b{font-family:var(--display);font-size:24px;line-height:1.05}
.wstats small{font-size:12px;color:var(--muted);align-self:flex-start}
.wstats small.chip{font-size:11px;padding:2px 7px;white-space:normal}
.excard .face{display:flex;flex-direction:column;gap:10px}
.excard.heavy{border-color:var(--plate);box-shadow:inset 0 3px 0 var(--plate)}
.heavy-tag{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.flip-link{border:0;background:none;padding:0;color:var(--accent);font:700 13px var(--body);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.flip-btn{border:1px solid var(--line);background:var(--surface);color:var(--accent);font:700 13px var(--body);border-radius:999px;padding:6px 12px;cursor:pointer;flex-shrink:0}
.muscles{display:flex;flex-wrap:wrap;gap:6px}
.gsec b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.gsec ul,.gsec ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.warn-sec b{color:var(--warn)}
.btn.video{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.video svg{width:18px;height:18px}
.excard.flipping{animation:flip .3s ease-in-out}
@keyframes flip{0%{transform:perspective(900px) rotateY(0)}49%{transform:perspective(900px) rotateY(90deg)}51%{transform:perspective(900px) rotateY(-90deg)}100%{transform:perspective(900px) rotateY(0)}}
.e1{padding:10px 0;border-top:1px solid var(--line)}
.e1:first-of-type{border-top:0}
.e1-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.e1-h em{font-style:normal;font-size:12.5px;font-weight:700}
.e1-h em.up{color:var(--ok)} .e1-h em.down{color:var(--warn)}
@media (prefers-reduced-motion: reduce){.excard.flipping{animation:none}}
.meal-main{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.meal-main .lbl{flex-basis:100%}
.linkish{border:0;background:none;padding:0;color:var(--fg);font:600 15px var(--body);text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.swap{border:1px solid var(--line);background:var(--surface);color:var(--accent);font:700 12px var(--body);border-radius:999px;padding:3px 10px;cursor:pointer}
.mday{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.mday:first-child{border-top:0;padding-top:0}
.mday-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mday-h b{font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.02em}
.mday-h span{font-size:12.5px;color:var(--muted)}
.mrow{display:grid;grid-template-columns:82px 1fr auto;gap:8px;align-items:center}
.mrow .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lib{gap:0}
.lib summary{font-weight:700;cursor:pointer;padding:2px 0;list-style-position:inside}
.rrow{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:none;color:var(--fg);font:500 14.5px var(--body);text-align:left;padding:10px 0;cursor:pointer}
.rrow:first-of-type{margin-top:8px}
.rrow em{font-style:normal;font-size:11px;font-weight:700;color:var(--plate);letter-spacing:.06em;text-transform:uppercase}
.rrow span:last-child{color:var(--muted);white-space:nowrap;font-size:13px}
.uses{display:block;font-size:12px;color:var(--muted);text-decoration:none}
.check.on .uses{text-decoration:none}
#sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-bg{position:absolute;inset:0;background:rgba(8,10,12,.55)}

(function(){

// ---------- Food: household, recipes, choices, shopping ----------
const FD=window.BB_DATA;
const ING=FD.ING, RECIPES=FD.RECIPES, HOUSE=FD.HOUSE, DEF=FD.DEFAULTS, ALIAS=FD.ALIAS, CUP=FD.CUPBOARD, TRIM=FD.TRIM, PACKS=FD.PACKS;

const isShared=slot=>HOUSE.shared.indexOf(slot)>=0;

const CAT={"Protein":"p","Dairy and eggs":"p","Carbs":"c","Sauces and cupboard":"c","Fruit and veg":"v"};

const SPRE=/^([\d.]+)\s*(g|ml|tsp|tbsp|clove|x|pinch)\s+(.+)$/;

function seaGroups(r){const g=[];(r.comp||[]).forEach(t=>{const s=t[SIDX[t[0]]];if(typeof s!=="string"||!s)return;

function seaText(str,scs,mult){const acc={};scs.forEach(sc=>seaParse(str).forEach(s=>{const k=s.u+"|"+s.n;(acc[k]=acc[k]||{u:s.u,n:s.n,q:0}).q+=s.q*itemScale(s.n,sc)*(mult||1)}));return Object.values(acc).map(seaFmt).join(", ")}
let shopView="house";
function shopPeople(){return shopView==="house"?HOUSE.order:[shopView]}
function shopList(){const agg={},uses={},cup={};
  shopPeople().forEach(w=>{ORDER.forEach(d=>SLOTS.forEach(sl=>{const r=RECIPES[choice(sl,d,w)];if(!r)return;const sc=scFor(r.id,w);
    r.ing.forEach(([i,g])=>{agg[i]=(agg[i]||0)+g*scaleOf(i,sc);(uses[i]=uses[i]||{})[r.name]=1});

// ---------- Sunday run sheet ----------

  const list=a=>{a=[...new Set(a)];return a.length<3?a.join(" and "):a.slice(0,-1).join(", ")+" and "+a[a.length-1]};
  const lower=id=>ING[id]?ING[id][0].toLowerCase():id;
  const mins=m=>m<60?m+" min":Math.floor(m/60)+" h"+(m%60?" "+(m%60)+" min":"");
  const SHORT={"jasmine-rice":"jasmine or basmati rice",pasta:"pasta",penne:"penne","rice-noodles":"rice noodles","chicken-thigh":"chicken thigh","beef-mince":"beef mince","lamb-mince":"lamb mince","turkey-mince":"turkey mince",steak:"sirloin steak","turkey-rashers":"turkey rashers",tuna:"drained tuna",prawns:"king prawns",eggs:"egg","egg-whites":"egg whites","greek-yog":"Greek yoghurt",broccoli:"broccoli",greens:"pak choi or greens",edamame:"edamame",peas:"peas",berries:"berries",corn:"sweetcorn","kidney-beans":"kidney beans",brioche:"brioche bun",wrap:"wrap","mini-wrap":"mini wrap","english-muffin":"English muffin","thin-bagel":"thin bagel","sub-roll":"sub roll","pizza-base":"pizza base",mozzarella:"mozzarella",cheddar:"cheddar","cheese-slice":"cheese slice",jalapenos:"pickled jalapeños",oreo:"Oreo"};

function askPersist(){if(persistAsked)return;persistAsked=true;try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}}
function save(k,v){cache[k]=v;lsSet(k,v);askPersist();if(/^(ex-|progress$|mealhist$|supphist$)/.test(k))reviewSoon();setSync(storageOK?"Saved on this phone":"Couldn’t save. Check Chrome isn’t in incognito mode.")}
let syncMsg="Saved on this phone";
function setSync(m){syncMsg=m;const el=$("#sync");if(el)el.textContent=m}
function saveSoon(k,v){save(k,v)}
function allData(){const out={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(LS)===0){out[k.slice(LS.length)]=lsGet(k.slice(LS.length))}}}catch(e){}return out}
function mondayOf(d){const x=new Date(d);const off=(x.getDay()+6)%7;x.setDate(x.getDate()-off);return iso(x)}
["partner","shareset","sharegot"].forEach(k=>{try{localStorage.removeItem(LS+k)}catch(e){}}); // retired with the household update
const THIS_MONDAY=mondayOf(new Date());
const NEXT_MONDAY=(()=>{const d=parse(THIS_MONDAY);d.setDate(d.getDate()+7);return iso(d)})();
// Menus are kept per week (keyed by that week's Monday). Today and Week always read this week;
// the Food tab reads whichever week is selected, so planning ahead never changes this week.
let foodWk=new Date().getDay()===0?NEXT_MONDAY:THIS_MONDAY;
let viewWk=THIS_MONDAY;
function allMenus(){let all=get("menus",null);if(!all){const old=get("menu",null);all={};if(old&&Object.keys(old).length)all[THIS_MONDAY]=old;cache.menus=all;if(old&&Object.keys(old).length)lsSet("menus",all)}return all}
function menuFor(wk){const all=allMenus();if(all[wk])return all[wk];const prev=Object.keys(all).filter(k=>k<wk).sort().pop();return prev?all[prev]:{}}
function weekRange(wk){const b=parse(wk);b.setDate(b.getDate()+6);return fmtDate(wk)+" to "+fmtDate(iso(b))}
function weekWord(wk){return wk===THIS_MONDAY?"this week":wk===NEXT_MONDAY?"next week":"the week of "+fmtDate(wk)}
function shopState(){return (get("shops",{})[viewWk])||{t:{}}}
function saveShop(st){const all=Object.assign({},get("shops",{}));all[viewWk]=st;Object.keys(all).sort().slice(0,-4).forEach(k=>delete all[k]);save("shops",all)}

// ---------- State accessors ----------
function settings(){return get("settings",{mode:"gym",start:null})}
function mode(){return settings().mode||"gym"}
function startDate(){return settings().start||TODAY}
function weekNo(){const days=Math.floor((parse(TODAY)-parse(startDate()))/864e5);return Math.max(1,Math.floor(days/7)+1)}
function phase(){const w=weekNo();return P.phases.find(x=>x.until==null||w<=x.until)||P.phases[P.phases.length-1]}
function kcalTarget(){return phase().kcal}
function exKey(id){return "ex-"+id+"-"+mode()}
function hist(id){return get(exKey(id),{h:[]}).h||[]}
function todayEntry(id,sets){const h=hist(id);let e=h.find(x=>x.d===TODAY);if(!e){e={d:TODAY,sets:Array.from({length:sets},()=>({w:"",r:"",done:false}))}}return e}
function lastEntry(id){const h=hist(id).filter(x=>x.d<TODAY&&x.sets.some(s=>s.done));return h.length?h[h.length-1]:null}
function putEntry(id,e,now){const h=hist(id).filter(x=>x.d!==e.d);h.push(e);h.sort((a,b)=>a.d<b.d?-1:1);const v={h:h};(now?save:saveSoon)(exKey(id),v)}

// ---------- Rendering ----------
let tab=(location.hash||"").replace("#","");if(!["today","week","food","progress"].includes(tab))tab="today";
let weekSel=new Date().getDay();
function exRow(e){const m=mode();return m==="home"?{id:e[0],name:e[5],sets:e[2],lo:e[6],hi:e[7],rest:e[9]==="m"?e[8]:Math.min(e[8],120),unit:e[9],heavy:false}:{id:e[0],name:e[1],sets:e[2],lo:e[3],hi:e[4],rest:e[8],unit:e[9],heavy:e[10]==="H"}}
function repsLabel(x){return x.unit==="m"?(x.lo===x.hi?x.lo+" m":x.lo+"–"+x.hi+" m"):(x.lo===x.hi?x.lo:x.lo+"–"+x.hi)}
function restLabel(s){if(s<120)return s+" s";const m=s/60;return (Number.isInteger(m)?m:m.toFixed(1))+" min"}

function renderStatus(){
  $("#status").textContent="Week "+weekNo()+" · "+phase().name+" · "+fmtN(kcalTarget())+" kcal";$("#brand-name").textContent=P.app;
  $("#m-gym").setAttribute("aria-pressed",mode()==="gym");$("#m-home").setAttribute("aria-pressed",mode()==="home");
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
}

function exerciseCard(e){
  const x=exRow(e), cur=todayEntry(x.id,x.sets), last=lastEntry(x.id);
  let lastHtml='<span class="chip muted">First session</span><span>Start light and learn the movement.</span>';
  if(last){
    const done=last.sets.filter(s=>s.done);
    const txt=done.map(s=>(s.w!==""?s.w+"×":"")+s.r).join(", ");
    lastHtml='<span>Last ('+fmtDate(last.d)+'): <b class="num">'+esc(txt)+'</b>'+(done[0]&&done[0].w!==""?' <span class="rest-note">kg×reps</span>':'')+'</span>';
    const hitTop=x.unit!=="m"&&last.sets.length>=x.sets&&last.sets.every(s=>s.done&&Number(s.r)>=x.hi);
    if(hitTop){const inc=(x.id==="deadlift"||x.id==="rackpull"||x.id==="squat")?"5":"2.5";lastHtml='<span class="chip plate">'+(done.some(s=>s.w!=="")?(x.heavy?"Add "+inc+" kg today":"Add weight today"):"Harder variation today")+'</span>'+lastHtml}
  }
  const rows=cur.sets.map((s,i)=>{
    const ph=last&&last.sets[i]?last.sets[i]:null;
    return '<div class="set'+(s.done?' done':'')+'" data-id="'+x.id+'" data-i="'+i+'">'+
      '<span class="n">SET '+(i+1)+'</span>'+
      '<label><input id="w-'+x.id+'-'+i+'" type="number" inputmode="decimal" step="0.5" min="0" aria-label="'+esc(x.name)+' set '+(i+1)+' weight" value="'+esc(s.w)+'" placeholder="'+(ph&&ph.w!==""?esc(ph.w):"")+'" data-f="w"><small>kg</small></label>'+
      '<span class="x">×</span>'+
      '<label><input id="r-'+x.id+'-'+i+'" type="number" inputmode="numeric" min="0" aria-label="'+esc(x.name)+' set '+(i+1)+' '+(x.unit==="m"?"metres":"reps")+'" value="'+esc(s.r)+'" placeholder="'+(ph?esc(ph.r):x.hi)+'" data-f="r"><small>'+(x.unit==="m"?"m":"reps")+'</small></label>'+
      '<button type="button" class="tick" data-tick aria-pressed="'+s.done+'" aria-label="Mark set '+(i+1)+' done">✓</button></div>'}).join("");
  const g=guideFor(x), side=sideInfo(g,x);
  const li=a=>a.map(t=>'<li>'+esc(t)+'</li>').join("");
  const back=g?'<div class="face back" hidden>'+
    '<div class="ex-head"><div><div class="eyebrow">Form guide</div><h3>'+esc(x.name)+'</h3></div><button type="button" class="flip-btn" data-flip aria-label="Back to logging">Log sets</button></div>'+
    '<div class="muscles">'+g.m.map(t=>'<span class="chip muted">'+esc(t)+'</span>').join("")+'</div>'+
    '<div class="gsec"><b>Set up</b><ul>'+li(g.s)+'</ul></div>'+
    '<div class="gsec"><b>Do it</b><ol>'+li(g.c)+'</ol></div>'+
    '<div class="gsec warn-sec"><b>Avoid</b><ul>'+li(g.x)+'</ul></div>'+
    '<a class="btn video" href="https://www.youtube.com/results?search_query='+encodeURIComponent(g.q)+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>Watch form videos</a>'+
    '<p class="rest-note">Opens YouTube. Pick a video from an established coach and check it matches the cues above.</p></div>':'';
  return '<section class="card excard'+(x.heavy?' heavy':'')+'" data-ex="'+x.id+'" data-rest="'+x.rest+'" data-name="'+esc(x.name)+'"><div class="face front">'+
    (x.heavy?'<div class="heavy-tag"><span class="chip plate">Heavy lift</span><span>Stop 1–2 reps short of failure.</span></div>':'')+
    '<div class="ex-head"><div><h3>'+esc(x.name)+'</h3><div class="ex-meta">Rest '+restLabel(x.rest)+(g?' · <button type="button" class="flip-link" data-flip>Form guide</button>':'')+'</div></div>'+
    '<div class="target num">'+x.sets+' × '+repsLabel(x)+(side?'<small>'+side[0]+'</small>':'')+'</div></div>'+
    (side?'<p class="uni">'+side[1]+'</p>':'')+
    '<div class="last">'+lastHtml+'</div><div class="sets">'+rows+'</div></div>'+back+'</section>';
}

function mealsBlock(dow,interactive){
  const md=get("meals",{d:TODAY,t:{}}); const t=(interactive&&md.d===TODAY)?md.t:{};
  const keys={breakfast:"b",shake:"k",lunch:"l",dinner:"d",snack:"s"};
  let kc=0,pr=0;
  const rows=dayMenu(dow).map(m=>{const r=RECIPES[m.id], x=macros(m.id), key=keys[m.slot];
    if(t[key]){kc+=x.k;pr+=x.p}
    return '<div class="meal">'+(interactive?'<button type="button" class="box" data-meal="'+key+'" aria-pressed="'+!!t[key]+'" aria-label="Ate '+esc(SLOTNAME[m.slot])+'">✓</button>':'<span></span>')+
      '<div class="meal-main"><div class="lbl">'+SLOTNAME[m.slot]+'</div><button type="button" class="linkish" data-recipe="'+m.id+'" data-dow="'+dow+'" data-slot="'+m.slot+'">'+esc(r?r.name:"")+'</button>'+
      '<button type="button" class="swap" data-swap="'+m.slot+'" data-dow="'+dow+'">Swap</button>'+(r.type==="fresh"?'<small class="onday">Cook fresh tonight · '+esc(r.time)+'. Tap for the recipe.</small>':(r.finish?'<small class="onday">'+esc(r.finish)+'</small>':''))+'</div>'+
      '<div class="k num">'+x.k+' kcal<br>'+x.p+' g P</div></div>'}).join("");
  const tot=dayTotals(dow), tgtK=kcalTarget(), tgtP=P.protein;
  const meters=interactive?'<div class="totals"><div class="meter"><div class="row"><span>Calories</span><span class="num"><b>'+fmtN(kc)+'</b> / '+fmtN(tgtK)+'</span></div><div class="bar"><i style="width:'+Math.min(100,kc/tgtK*100)+'%"></i></div></div>'+
    '<div class="meter"><div class="row"><span>Protein</span><span class="num"><b>'+pr+'</b> / '+tgtP+' g</span></div><div class="bar"><i style="width:'+Math.min(100,pr/tgtP*100)+'%"></i></div></div></div>':'';
  return '<section class="card">'+meters+'<div>'+rows+'</div><p class="rest-note num">This menu: '+fmtN(tot.k)+' kcal · '+tot.p+' g protein. Tap a meal for its recipe.'+(phase().mealNote?' '+esc(phase().mealNote):'')+'</p></section>';
}

function renderToday(){
  const dow=new Date().getDay(), D=DAYS[dow];
  let h='<div><div class="eyebrow">'+DFULL[dow]+' · '+fmtDate(TODAY)+'</div><h1 class="day">'+esc(D.title)+'</h1><p class="lead">'+esc(D.focus)+'</p></div>';
  if(P.banner&&P.banner.weeks.indexOf(weekNo())>=0){h+='<div class="banner">'+P.banner.text+'</div>'}
  h+=weighInCard()+suppCard();
  if(D.rest){
    const nx=ORDER[(ORDER.indexOf(dow)+1)%7];
    h+='<section class="card rest-card"><h3 style="margin:0">Rest day</h3><p class="empty">Walk 8–10k steps and sleep 7–9 hours. Recovery is when the muscle is built.</p><p class="empty">Tomorrow: <b>'+esc(DAYS[nx].title)+'</b>.</p>'+(dow===0?'<button type="button" class="btn ghost small" data-go="food">Open Sunday prep</button>':'')+'</section>';
  } else {
    h+='<p class="rest-note">'+(mode()==="home"?"Home version: slow the lowering to 3 seconds and finish each set close to failure. Heavy strength work needs the gym.":"Warm up 5 minutes, then build up to your heavy lift over 3–4 lighter sets. Tap Form guide on any exercise for cues and videos.")+' Tick a set to start its rest timer.</p>';
    h+=D.ex.map(exerciseCard).join("");
  }
  h+='<h2 class="sec">Today’s food</h2>'+mealsBlock(dow,true);
  h+='<p class="sync" id="sync">'+esc(syncMsg)+'</p>';
  return h;
}

  const strip='<div class="strip">'+ORDER.map(d=>'<button type="button" data-day="'+d+'" aria-pressed="'+(d===weekSel)+'" class="'+(d===new Date().getDay()?'today':'')+'"><b>'+DNAME[d]+'</b><span>'+esc(DAYS[d].title.split(" ")[0])+'</span></button>').join("")+'</div>';

let menuWho=null;

// ---------- Recipe and swap sheet ----------
let sheet=null;
function openSheet(state){sheet=state;renderSheet();$("#sheet").hidden=false;document.body.style.overflow="hidden";const c=$("#sheet .x-btn");if(c)c.focus({preventScroll:true})}
function closeSheet(){sheet=null;$("#sheet").hidden=true;document.body.style.overflow=""}
function blockOf(dow){return dow>=1&&dow<=3?[[1,2,3],"Mon–Wed"]:dow>=4?[[4,5,6],"Thu–Sat"]:null}
function renderSheet(){if(!sheet)return;const T=$("#sheet-title"),B=$("#sheet-body");const who=sheet.who||ME;
  if(sheet.mode==="timers"){T.textContent="Timers";B.innerHTML=timerSheet();return}
  if(sheet.mode==="swap"){const cur=choice(sheet.slot,sheet.dow,who),blk=blockOf(sheet.dow);
    T.textContent=DFULL[sheet.dow]+" "+SLOTNAME[sheet.slot].toLowerCase()+(isShared(sheet.slot)?"":" · "+(who===ME?"you":pname(who)));
    let last=null;
    B.innerHTML='<p class="rest-note">'+(isShared(sheet.slot)?'One choice for both of you. ':'')+(sheet.slot==="lunch"&&sheet.dow>=4?'Thursday to Saturday lunches are limited to ones that freeze or keep. ':'')+'The shopping list and prep update straight away.</p>'+pool(sheet.slot,sheet.dow,who).map(id=>{const r=RECIPES[id],x=macros(id,who),on=id===cur;
      const head=(r.type&&r.type!==last)?'<h3 class="rh">'+DTYPE[r.type][0]+'</h3><p class="rest-note" style="margin:0">'+DTYPE[r.type][1]+'</p>':'';last=r.type||null;
      return head+'<div class="opt'+(on?' on':'')+'"><div class="opt-top"><b>'+esc(r.name)+'</b>'+(on?'<span class="chip ok">Current</span>':'')+'</div>'+
        '<div class="opt-meta num">'+x.k+' kcal · '+x.p+' g protein · '+x.c+' g carbs · '+x.f+' g fat'+(r.time?' · '+esc(r.time):'')+(r.late==="no"?' · Mon–Wed only':'')+'</div>'+
        '<div class="data-btns">'+(on?'':'<button type="button" class="btn small" data-choose="'+id+'" data-days="'+sheet.dow+'">Choose</button>')+
          (sheet.slot==="lunch"&&blk&&allowed(id,"lunch",blk[0][0],who)?'<button type="button" class="btn ghost small" data-choose="'+id+'" data-days="'+blk[0].join(",")+'">Use '+blk[1]+'</button>':'')+
          (sheet.slot==="snack"?'<button type="button" class="btn ghost small" data-choose="'+id+'" data-days="'+ORDER.join(",")+'">Use all week</button>':'')+
          '<button type="button" class="btn ghost small" data-recipe="'+id+'" data-dow="'+sheet.dow+'" data-slot="'+sheet.slot+'" data-who="'+who+'" data-from="swap">Recipe</button></div></div>'}).join("");
    return}
  const r=RECIPES[sheet.id], x=macros(sheet.id,who), s=sheet.serv||1;
  // Shared dishes are cooked for both; a shake is shown for two when you both picked it that day.
  const sameShake=r.slot==="shake"&&sheet.dow!=null&&choice("shake",sheet.dow,ME)===r.id&&choice("shake",sheet.dow,OTHER)===r.id;
  const ppl=(isShared(r.slot)||sameShake)?HOUSE.order:[who], both=ppl.length>1, scs=ppl.map(w=>scFor(r.id,w));
  const lab=w=>w===ME?"You":pname(w);
  T.textContent=r.name;
  const canUse=sheet.dow!=null&&sheet.slot&&allowed(r.id,sheet.slot,sheet.dow,who)&&choice(sheet.slot,sheet.dow,who)!==r.id;
  const groups=seaGroups(r);
  B.innerHTML=(sheet.from==="swap"?'<button type="button" class="btn ghost small" data-back>‹ Back to options</button>':'')+
    '<div class="rmeta">'+[r.time,r.tag,SLOTNAME[r.slot]].filter(Boolean).map(esc).join(" · ")+'</div>'+
    (DTYPE[r.type]?'<p class="rest-note" style="margin:0">'+typeChip(r)+' '+DTYPE[r.type][1]+'</p>':'')+
    '<div class="tiles num"><div><b>'+x.k+'</b><span>kcal</span></div><div><b>'+x.p+' g</b><span>protein</span></div><div><b>'+x.c+' g</b><span>carbs</span></div><div><b>'+x.f+' g</b><span>fat</span></div></div>'+
    '<p class="rest-note">'+(both?'Macros are '+(who===ME?'your':esc(poss(who)))+' portion. Amounts below are for both of you, with each person’s share underneath.':'Macros and amounts are '+(who===ME?'your':esc(poss(who)))+' portion.')+' Raw weights unless stated; rice and pasta are dry.</p>'+
    '<div class="serv"><span>'+(both?'Batches':'Servings')+'</span><button type="button" class="btn ghost small" data-serv="-1" aria-label="Fewer">−</button><b class="num">'+s+'</b><button type="button" class="btn ghost small" data-serv="1" aria-label="More">+</button></div>'+
    (sameShake?'<p class="rest-note">You both have this today. Blend the total, then pour the larger glass for '+(person(ME).scales.p>=person(OTHER).scales.p?'you':esc(pname(OTHER)))+'.</p>':'')+
    '<h3 class="rh">Ingredients</h3><ul class="list ing">'+r.ing.map(([i,g])=>'<li><span>'+esc(ING[i]?ING[i][0]:i)+(both?'<small class="uses">'+ppl.map(w=>lab(w)+' '+esc(amount(i,g*s*scaleOf(i,scFor(r.id,w))))).join(' · ')+'</small>':'')+'</span><span class="num">'+esc(amount(i,g*s*scs.reduce((a,sc)=>a+scaleOf(i,sc),0)))+'</span></li>').join("")+'</ul>'+
    (groups.length?'<h3 class="rh">Seasoning and sauces</h3><p class="rest-note" style="margin:0">How the sauces, marinades and seasonings are made up'+(both?', for both of you':'')+'. Anything listed above is the same food, not extra.</p><ul class="list sea">'+groups.map(g=>'<li><span><b>'+esc(g[0])+'</b><small class="uses">'+esc(seaText(g[1],scs,s))+'</small></span></li>').join("")+'</ul>':'')+
    (r.finish?'<p class="banner"><b>After Sunday prep:</b> '+esc(r.finish)+'.</p><h3 class="rh">From scratch</h3><p class="rest-note" style="margin:0">Use this if it wasn’t prepped.</p>':'<h3 class="rh">Method</h3>')+
    '<ol class="method">'+r.method.map(m=>'<li>'+esc(m)+'</li>').join("")+'</ol>'+
    (canUse?'<button type="button" class="btn" data-choose="'+r.id+'" data-days="'+sheet.dow+'">Use for '+DFULL[sheet.dow]+' '+SLOTNAME[sheet.slot].toLowerCase()+'</button>':'');
}
document.addEventListener("click",ev=>{
  const rb=ev.target.closest("[data-recipe]");
  if(rb){ev.preventDefault();const d=rb.dataset.dow;openSheet({mode:"recipe",id:rb.dataset.recipe,dow:d!=null&&d!==""?Number(d):null,slot:rb.dataset.slot||null,who:rb.dataset.who||ME,serv:1,from:rb.dataset.from||null});return}
  const sw=ev.target.closest("[data-swap]");
  if(sw){openSheet({mode:"swap",slot:sw.dataset.swap,dow:Number(sw.dataset.dow),who:sw.dataset.who||ME});return}
  if(!sheet)return;
  if(ev.target.closest("[data-close]")){closeSheet();return}
  if(ev.target.closest("[data-back]")){sheet={mode:"swap",slot:sheet.slot,dow:sheet.dow,who:sheet.who};renderSheet();return}
  const sv=ev.target.closest("[data-serv]");
  if(sv){sheet.serv=Math.min(8,Math.max(1,(sheet.serv||1)+Number(sv.dataset.serv)));renderSheet();return}
  const ch=ev.target.closest("[data-choose]");
  if(ch){setChoice(sheet.slot,ch.dataset.days.split(",").map(Number),ch.dataset.choose,sheet.who||ME);closeSheet();const y=window.scrollY;render();window.scrollTo(0,y);return}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&sheet)closeSheet()});

function lineChart(pts,unit,dp){
  const W=320,H=150,L=38,R=12,T=12,B=26;
  const ys=pts.map(p=>p.v); let mn=Math.min(...ys), mx=Math.max(...ys); if(mx-mn<2){const c=(mx+mn)/2;mn=c-1;mx=c+1} const padv=(mx-mn)*.12; mn-=padv; mx+=padv;
  const t0=parse(pts[0].d).getTime(), t1=parse(pts[pts.length-1].d).getTime(), span=Math.max(1,t1-t0);
  const X=d=>L+(parse(d).getTime()-t0)/span*(W-L-R), Y=v=>T+(mx-v)/(mx-mn)*(H-T-B);
  const ticks=[mn+padv,(mn+mx)/2,mx-padv];
  const path=pts.map((p,i)=>(i?"L":"M")+X(p.d).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const area=path+" L"+X(pts[pts.length-1].d).toFixed(1)+" "+(H-B)+" L"+X(pts[0].d).toFixed(1)+" "+(H-B)+" Z";
  const lp=pts[pts.length-1];
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+unit+' over time">'+
    ticks.map(v=>'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end" font-size="10.5" fill="var(--muted)">'+v.toFixed(dp)+'</text>').join("")+
    '<path d="'+area+'" fill="var(--accent)" opacity=".1"/><path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
    pts.map(p=>'<circle cx="'+X(p.d).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="2.6" fill="var(--accent)"/>').join("")+
    '<circle cx="'+X(lp.d).toFixed(1)+'" cy="'+Y(lp.v).toFixed(1)+'" r="4.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.2"/>'+
    '<text x="'+L+'" y="'+(H-8)+'" font-size="10.5" fill="var(--muted)">'+fmtDate(pts[0].d)+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" font-size="10.5" fill="var(--muted)">'+fmtDate(lp.d)+'</text></svg>';
}

function bestSet(e){let b=null;(e.sets||[]).forEach(s=>{if(s.done&&s.w!==""){const w=Number(s.w);if(!b||w>b.w||(w===b.w&&Number(s.r)>b.r))b={w:w,r:Number(s.r)}}});return b}

// ---------- Body: daily weigh-ins, weekly waist ----------
function bodyEntries(){return (get("progress",{e:[]}).e||[]).slice().sort((a,b)=>a.d<b.d?-1:1)}
// Body weight is stored in kg. Apps set to pounds convert on the way in and out.
const WU=P.weightUnit==="lb"?"lb":"kg", LBK=2.2046226;
const wOut=kg=>Math.round(kg*(WU==="lb"?LBK:1)*10)/10;
const wIn=v=>WU==="lb"?Math.round(Number(v)/LBK*100)/100:Number(v);
const wOK=v=>{const n=Number(v);return v!==""&&(WU==="lb"?(n>=66&&n<=660):(n>=30&&n<=300))};
function weekAvgs(){const m={};bodyEntries().forEach(x=>{if(x.w==null||x.w==="")return;const k=mondayOf(parse(x.d));(m[k]=m[k]||[]).push(Number(x.w))});
  return Object.keys(m).sort().map(k=>({wk:k,avg:Math.round(m[k].reduce((a,b)=>a+b,0)/m[k].length*100)/100,n:m[k].length}))}
function saveBody(d,w,wa){const all=get("progress",{e:[]}).e||[];const old=all.find(x=>x.d===d)||{};
  const pr=all.filter(x=>x.d!==d);pr.push({d:d,w:w!==""&&w!=null?Number(w):(old.w!=null?old.w:null),waist:wa!==""&&wa!=null?Number(wa):(old.waist!=null?old.waist:null)});
  ensureStart();save("progress",{e:pr.sort((a,b)=>a.d<b.d?-1:1).slice(-800)})}
function weekStatus(){const wa=weekAvgs();if(wa.length<2)return null;const a=wa[wa.length-2],b=wa[wa.length-1];if(b.n<3||a.n<3)return {a:a,b:b,chg:Math.round((b.avg-a.avg)*10)/10,cls:"muted",txt:"Needs 3+ weigh-ins in both weeks"};
  const c=Math.round((b.avg-a.avg)*10)/10;let cls="ok",txt="On track";
  const ph=phase();if(c>ph.trend[1]){cls="warn";txt=ph.high}else if(c<ph.trend[0]){cls="warn";txt=ph.low}
  return {a:a,b:b,chg:c,cls:cls,txt:txt}}
function weighInCard(){const all=bodyEntries();const lastW=all.filter(x=>x.w!=null).slice(-1)[0];const t=all.find(x=>x.d===TODAY);const wa=weekAvgs();const cur=wa.length?wa[wa.length-1]:null;
  const isSun=new Date().getDay()===0;const needWaist=isSun&&!(t&&t.waist!=null);
  if(t&&t.w!=null&&!needWaist){return '<section class="card weigh done-weigh"><div class="wrow"><span class="chip ok">Weighed in</span><span class="num"><b>'+wOut(t.w)+' '+WU+'</b> today'+(cur?' · this week\u2019s average '+wOut(cur.avg)+' '+WU+' ('+cur.n+')':'')+'</span></div></section>'}
  return '<section class="card weigh"><div class="wrow"><b>Morning weigh-in</b><span class="rest-note">After the toilet, before food or drink.</span></div><div class="form" style="grid-template-columns:'+(needWaist?'1fr 1fr auto':'1fr auto')+'">'+
    (t&&t.w!=null?'<label>Weight ('+WU+')<input type="text" value="'+wOut(t.w)+' '+WU+'" disabled></label>':'<label for="q-w">Weight ('+WU+')<input id="q-w" type="number" inputmode="decimal" step="0.1" placeholder="'+(lastW?wOut(lastW.w):WU)+'"></label>')+
    (needWaist?'<label for="q-waist">Waist, Sunday (cm)<input id="q-waist" type="number" inputmode="decimal" step="0.5" placeholder="at navel"></label>':'')+
    '<button type="button" class="btn" id="q-save">Save</button></div><p class="rest-note" id="q-msg"></p></section>'}

let missedMsg="";
function renderProgress(){
  const pr=get("progress",{e:[]}).e||[];
  const sorted=pr.slice().sort((a,b)=>a.d<b.d?-1:1);
  const first=sorted[0], last=sorted[sorted.length-1];
  let h='<div><div class="eyebrow">Progress · week '+weekNo()+(P.planWeeks&&weekNo()<=P.planWeeks?' of '+P.planWeeks:'')+'</div><h1 class="day">'+esc(phase().name)+'</h1><p class="lead">Your morning weigh-ins from the Today tab are averaged by week here, so daily ups and downs don’t matter. Add your waist once a week.</p></div>';
  const lastWaist=sorted.filter(x=>x.waist!=null).slice(-1)[0];
  h+='<section class="card"><div class="wrow" style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><b>Waist measurement</b><span class="rest-note num">'+(lastWaist?'Last: '+lastWaist.waist+' cm on '+fmtDate(lastWaist.d):'Once a week')+'</span></div>'+

  const stat=wks.length?'<div class="wstats num"><div><span>This week</span><b>'+wOut(wks[wks.length-1].avg)+' '+WU+'</b><small>'+wks[wks.length-1].n+' weigh-in'+(wks[wks.length-1].n===1?'':'s')+'</small></div>'+
    (st?'<div><span>Last week</span><b>'+wOut(st.a.avg)+' '+WU+'</b><small>'+st.a.n+' weigh-ins</small></div><div><span>Change</span><b>'+(wOut(st.b.avg-st.a.avg)>0?"+":"")+wOut(st.b.avg-st.a.avg)+' '+WU+'</b><small class="chip '+st.cls+'">'+esc(st.txt)+'</small></div>':'')+'</div>':'';
  const goal=P.goalWeight&&wks.length?'<p class="goal num"><b>Goal '+wOut(P.goalWeight)+' '+WU+'</b> · '+Math.max(0,wOut(wks[wks.length-1].avg-P.goalWeight))+' '+WU+' to go</p>':'';
  h+='<h2 class="sec">Weight (weekly average)</h2><section class="card chart">'+stat+goal+(wkp.length>=2?lineChart(wkp,"Weekly average weight in "+WU,1)+'<p class="rest-note">Each point is one week\u2019s average, dated from its Monday. Target: '+esc(phase().trendText)+'.</p>':'<p class="empty">Weigh in each morning. Your weekly average line starts after two weeks.</p>')+
    '<details class="missed"'+(missedMsg?' open':'')+'><summary>Add a missed weigh-in</summary><div class="form" style="grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto"><label for="m-date">Date<input id="m-date" type="date" max="'+TODAY+'" value="'+iso(new Date(Date.now()-864e5))+'"></label><label for="m-w">Weight ('+WU+')<input id="m-w" type="number" inputmode="decimal" step="0.1" placeholder="'+WU+'"></label><button type="button" class="btn" id="m-save">Add</button></div><p class="rest-note" id="m-msg" aria-live="polite">'+esc(missedMsg)+'</p></details>'+
    '</section>';missedMsg="";
  h+='<h2 class="sec">Waist</h2><section class="card chart">'+(cp.length>=2?lineChart(cp,"Waist in cm",1)+'<p class="rest-note num">'+cp[0].v.toFixed(1)+' → '+cp[cp.length-1].v.toFixed(1)+' cm ('+((cp[cp.length-1].v-cp[0].v)>=0?"+":"")+(cp[cp.length-1].v-cp[0].v).toFixed(1)+')</p>':'<p class="empty">Measure at the navel, relaxed, every Sunday. Two entries draw the line.</p>')+'</section>';
  // checkpoints
  const waistDrop=(cp.length>=2)?cp[0].v-cp[cp.length-1].v:null;

  const cps=P.checkpoints;
  h+='<h2 class="sec">Checkpoints</h2><section class="card">'+cps.map(c=>{

    if((c[1]!=null&&waistDrop!=null&&waistDrop>=c[1])||(c[2]!=null&&wDrop!=null&&wDrop>=c[2]))chip='<span class="chip ok">Hit</span>';
    else if(wk<c[0])chip='<span class="chip muted">Week '+c[0]+'</span>';
    else chip='<span class="chip warn">Not yet</span>';
    return '<div class="cp"><span class="w num">WK '+c[0]+'</span><span>'+esc(c[3])+'</span>'+chip+'</div>'}).join("")+'</section>';
  // lifts
  const rows=MAIN_LIFTS.map(l=>{const hh=hist(l[0]).filter(e=>bestSet(e));if(!hh.length)return null;const a=bestSet(hh[0]),b=bestSet(hh[hh.length-1]);
    return '<tr><td>'+esc(l[1])+'</td><td class="num">'+a.w+' × '+a.r+'</td><td class="num">'+b.w+' × '+b.r+'</td><td class="num">'+(b.w-a.w>=0?"+":"")+(b.w-a.w)+' kg</td></tr>'}).filter(Boolean);

  const e1html=E1RM_LIFTS.map(l=>{const pts=e1(l[0]);if(!pts.length)return "";const a=pts[0].v,b=pts[pts.length-1].v;

  if(sorted.length){h+='<h2 class="sec">Recent entries</h2><section class="card"><ul class="list">'+sorted.slice().reverse().slice(0,14).map(x=>'<li><span>'+fmtDate(x.d)+'</span><span class="num">'+(x.w?wOut(x.w)+' '+WU:'—')+' · '+(x.waist?x.waist+' cm':'—')+'</span></li>').join("")+'</ul></section>'}
  const bk=get("backup",null);
  h+='<h2 class="sec">Your data</h2><section class="card">'+
    '<p class="empty">Your whole record is kept on this phone with no time limit. Back up saves it to a file; Copy gives Claude the last 12 weeks to review.</p>'+
    '<div class="data-btns"><button type="button" class="btn" id="d-copy">Copy data for Claude</button><button type="button" class="btn ghost" id="d-backup">Back up</button><button type="button" class="btn ghost" id="d-restore">Restore</button></div>'+
    '<input type="file" id="d-file" accept="application/json,.json" hidden>'+
    '<textarea id="d-text" readonly hidden aria-label="Your data as text" style="width:100%;min-height:120px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);font:13px ui-monospace,monospace;padding:8px"></textarea>'+
    '<p class="rest-note" id="d-msg">Last backup: '+(bk?fmtDate(bk):"never")+'.</p>'+
    ((!bk||(parse(TODAY)-parse(bk))/864e5>14)?'<p class="banner"><b>Back up now.</b> '+(bk?'Your last backup was '+Math.round((parse(TODAY)-parse(bk))/864e5)+' days ago.':'You have no backup yet.')+' The full record lives on this phone, so a backup file is what protects it.</p>':'')+'</section>'+reviewCard();
  return h;

// small database. Body weight, training logs and meal ticks never leave the phone. Each phone holds a household

//   m/<week>/<field> = "dish@time"   r/<week> = time the week was reset   s/<week>/<tick> and p/<item> = ±time (minus = unticked)

  save("timers",all);syncPush(o);renderTimers();
  if(mins){try{ringCtx=ringCtx||new (window.AudioContext||window.webkitAudioContext)();if(ringCtx.state==="suspended")ringCtx.resume()}catch(e){}
    try{if(window.Notification&&Notification.permission==="default")Notification.requestPermission()}catch(e){}}}
function beep(){try{if(!ringCtx)return;[0,0.22,0.44].forEach(d=>{const o=ringCtx.createOscillator(),g=ringCtx.createGain();o.frequency.value=880;o.connect(g);g.connect(ringCtx.destination);const t=ringCtx.currentTime+d;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.5,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);o.start(t);o.stop(t+0.2)})}catch(e){}}
const ktLeft=(t,now)=>{const left=Math.round((t.e-now)/1000);return left<=0?"Done":Math.floor(left/60)+":"+pad(left%60)};
// One slim bar above the tabs: the next timer to finish and how many are running. Tap it for the full list.
function renderTimers(){const el=$("#ktimers");if(!el)return;const all=get("timers",{}),ids=Object.keys(all).sort((a,b)=>all[a].e-all[b].e),now=Date.now();
  // drop anything that finished more than two hours ago and was never dismissed
  ids.filter(i=>now-all[i].e>72e5).forEach(i=>setTimer(i));
  const live=ids.filter(i=>now-all[i].e<=72e5),done=live.filter(i=>all[i].e<=now);el.hidden=!live.length;
  done.forEach(i=>{if(notified[i])return;notified[i]=1;try{if(navigator.vibrate)navigator.vibrate([400,200,400,200,400])}catch(e){}
    try{if(window.Notification&&Notification.permission==="granted"&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification("Timer done",{body:all[i].l,tag:"kt-"+i,renotify:true,requireInteraction:true,icon:"icon-192.png"})).catch(()=>{})}catch(e){}});
  if(live.length){const i=done[0]||live[0],more=live.length-1;
    el.innerHTML='<div class="shell"><div class="kt'+(done.length?' done':'')+'"><button type="button" class="kt-open" data-ktopen aria-label="Show all timers"><b class="num">'+ktLeft(all[i],now)+'</b><span>'+esc(all[i].l)+'</span>'+(more?'<em>+'+more+' more</em>':'')+'</button>'+(done.length?'<button type="button" data-kt="'+esc(i)+'">Dismiss</button>':'')+'</div></div>'}else el.innerHTML="";
  document.body.classList.toggle("has-kt",live.length>0);
  if(sheet&&sheet.mode==="timers"){if(live.length)renderSheet();else closeSheet()}
  if(done.length&&!ringInt){beep();ringInt=setInterval(beep,2500)}else if(!done.length&&ringInt){clearInterval(ringInt);ringInt=null}}
function timerSheet(){const all=get("timers",{}),now=Date.now(),ids=Object.keys(all).sort((a,b)=>all[a].e-all[b].e);
  return '<p class="rest-note">Timers run on both phones. Cancelling or dismissing one here clears it on the other.</p>'+ids.map(i=>{const d=all[i].e<=now;
    return '<div class="opt kt-row'+(d?' on':'')+'"><div class="opt-top"><b class="num">'+ktLeft(all[i],now)+'</b><button type="button" class="btn ghost small" data-kt="'+esc(i)+'">'+(d?"Dismiss":"Cancel")+'</button></div><div>'+esc(all[i].l)+'</div><div class="opt-meta num">'+(all[i].n?all[i].n+' min timer · ':'')+(d?'finished':'ends')+' '+new Date(all[i].e).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})+'</div></div>'}).join("")}
setInterval(()=>{if(Object.keys(get("timers",{})).length)renderTimers()},1000);
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-kt]");if(b){setTimer(b.dataset.kt);return}
  if(ev.target.closest("[data-ktopen]"))openSheet({mode:"timers"})});

// ---------- Keep the screen awake while the app is open ----------
let wakeLock=null;
function keepAwake(){if(!("wakeLock" in navigator)||document.visibilityState!=="visible"||wakeLock)return;
  navigator.wakeLock.request("screen").then(l=>{wakeLock=l;l.addEventListener("release",()=>{wakeLock=null})}).catch(()=>{})}
document.addEventListener("visibilitychange",()=>{keepAwake();if(document.visibilityState==="visible"){renderTimers();syncFlush();if(syncKey()&&(!syncEs||syncEs.readyState===2))syncStart()}});
document.addEventListener("click",keepAwake,{passive:true});
keepAwake();

// ---------- The record: everything measured is kept, and can be shared privately for review ----------
// One line per day of what was eaten, rewritten whenever a meal is ticked or unticked.
function logMeals(md){const keys={breakfast:"b",shake:"k",lunch:"l",dinner:"d",snack:"s"},ate={};let k=0,p=0;
  dayMenu(parse(md.d).getDay()).forEach(m=>{if(md.t[keys[m.slot]]){const x=macros(m.id);k+=x.k;p+=x.p;ate[m.slot]=m.id}});
  const h=Object.assign({},get("mealhist",{}));if(Object.keys(ate).length)h[md.d]={ate:ate,k:k,p:p,tk:kcalTarget(),tp:P.protein};else delete h[md.d];save("mealhist",h)}
// Optional copy for Claude to read: this phone's record under its own private key, in weekly pieces. Off unless switched on.
function reviewKey(){const r=get("review",{})||{};return r.on&&r.key?r.key:null}
const fbKey=k=>String(k).replace(/[.$#\[\]\/]/g," ");
function recordWeeks(){const W={},at=(d,part)=>{const w=W[mondayOf(parse(d))]=W[mondayOf(parse(d))]||{};const o=w[part]=w[part]||{};return o[d]=o[d]||{}};
  (get("progress",{e:[]}).e||[]).forEach(x=>{const o=at(x.d,"body");if(x.w!=null&&x.w!=="")o.kg=Number(x.w);if(x.waist!=null&&x.waist!=="")o.waist_cm=Number(x.waist)});
  const seen={};Object.keys(DAYS).forEach(d=>(DAYS[d].ex||[]).forEach(e=>["gym","home"].forEach(m=>{const k="ex-"+e[0]+"-"+m;if(seen[k])return;seen[k]=1;
    (get(k,{h:[]}).h||[]).forEach(x=>{const done=x.sets.filter(z=>z.done);if(done.length)at(x.d,"sets")[fbKey(exName(e,m)+" ("+m+")")]=done.map(z=>(z.w!==""?z.w+"x":"")+z.r).join(", ")})})));
  const mh=get("mealhist",{});Object.keys(mh).forEach(d=>{const x=mh[d],o=at(d,"meals");o.ate={};Object.keys(x.ate).forEach(sl=>{o.ate[sl]=(RECIPES[x.ate[sl]]||{}).name||x.ate[sl]});o.kcal=x.k;o.protein_g=x.p;o.target_kcal=x.tk;o.target_protein_g=x.tp});
  const sh=get("supphist",{});Object.keys(sh).forEach(d=>{if(sh[d]&&sh[d].length)at(d,"supplements").taken=sh[d]});
  return W}
const strHash=t=>{let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return h+":"+t.length};
let reviewTimer=null, reviewNote="";
function setReview(t){reviewNote=t;const el=$("#rv-msg");if(el)el.textContent=t}
function reviewSoon(){if(!reviewKey())return;clearTimeout(reviewTimer);reviewTimer=setTimeout(reviewPush,3000)}
function reviewPush(){const key=reviewKey();if(!key)return;if(navigator.onLine===false){setReview("Offline: it will upload when you have signal.");return}
  const W=recordWeeks(),sent=Object.assign({},get("reviewh",{})),body={};
  Object.keys(W).forEach(wk=>{const h=strHash(JSON.stringify(W[wk]));if(sent[wk]!==h){body["w/"+wk]=W[wk];sent[wk]=h}});
  Object.keys(sent).forEach(wk=>{if(!W[wk]){body["w/"+wk]=null;delete sent[wk]}});
  if(!Object.keys(body).length){setReview("Up to date.");return}
  body.about={app:P.app,updated:new Date().toISOString(),weeks:Object.keys(W).sort(),plan_start:startDate(),target_kcal:kcalTarget(),target_protein_g:P.protein,
    note:"Body weight is stored in kg and waist in cm. Sets list completed sets as weight x reps, by exercise and where it was done. Read one week at a time from w/<monday date>."};
  fetch(SYNC_URL+"/x/"+key+".json",{method:"PATCH",body:JSON.stringify(body)}).then(r=>{if(r.ok){lsSet("reviewh",cache.reviewh=sent);setReview("Up to date.")}
    else setReview(r.status===401||r.status===403?"The database refused the upload. Publish the updated rules, then switch this off and on again.":"Upload failed. It will try again.")}).catch(()=>setReview("Offline: it will upload when you have signal."))}
function reviewCard(){const on=!!reviewKey();
  return '<h2 class="sec">Share my record with Claude</h2><section class="card">'+
    '<div class="seg wide" role="group"><button type="button" data-review="0" aria-pressed="'+!on+'">Off</button><button type="button" data-review="1" aria-pressed="'+on+'">On</button></div>'+
    '<p class="empty">'+(on?'A copy of your weigh-ins, waist, sets, meals eaten and supplements is kept online under a private key, so Claude can read it when you give it the key. Switching this off deletes that copy.':'Off: your record stays on this phone only. Switch on to keep a private online copy Claude can read for reviews, without copying and pasting.')+'</p>'+
    (on?'<div class="data-btns"><button type="button" class="btn small" id="rv-copy">Copy review key</button></div><textarea id="rv-text" hidden readonly class="share-ta" aria-label="Review key"></textarea>':'')+
    '<p class="rest-note" id="rv-msg" aria-live="polite">'+esc(on?reviewNote:"")+'</p></section>'}
$("#view").addEventListener("click",async ev=>{const b=ev.target.closest("[data-review]");
  if(b){const cur=get("review",{})||{};
    if(b.dataset.review==="1"&&!reviewKey()){save("review",{key:cur.key||newKey(),on:true});lsSet("reviewh",cache.reviewh={});reviewNote="Uploading…";render();reviewPush()}
    else if(b.dataset.review==="0"&&reviewKey()){const key=cur.key;clearTimeout(reviewTimer);save("review",{});lsSet("reviewh",cache.reviewh={});reviewNote="";render();
      fetch(SYNC_URL+"/x/"+key+".json",{method:"DELETE"}).then(r=>{const m=$("#d-msg");if(m)m.textContent=r.ok?"The online copy has been deleted.":"Couldn’t delete the online copy. Switch it on and off again when you have signal."}).catch(()=>{const m=$("#d-msg");if(m)m.textContent="Offline: the online copy is still there. Switch it on and off again when you have signal."})}
    return}
  if(ev.target.id==="rv-copy"){const t="GYMREVIEW:"+reviewKey();const ta=$("#rv-text");ta.hidden=false;ta.value=t;
    try{await navigator.clipboard.writeText(t);setReview("Review key copied. Paste it into your Claude chat. Anyone with this key can read your record, so only give it to Claude.")}
    catch(e){ta.focus();ta.select();setReview("Long-press the key above and copy it, then paste it into your Claude chat.")}}});
window.addEventListener("online",reviewPush);

// ---------- Your data: copy, backup, restore ----------
function exName(e,m){return m==="home"?e[5]:e[1]}
function exTarget(e,m){const lo=m==="home"?e[6]:e[3],hi=m==="home"?e[7]:e[4];return e[2]+"x"+(lo===hi?lo:lo+"-"+hi)+(e[9]==="m"?" m":"")}
function buildSummary(){
  const L=[],since=iso(new Date(parse(TODAY).getTime()-84*864e5));
  L.push(P.app.toUpperCase()+" DATA (exported "+TODAY+")");
  L.push("Plan start "+startDate()+" | week "+weekNo()+" | "+phase().label+" | target "+kcalTarget()+" kcal, "+P.protein+" g protein | currently training at "+mode());
  L.push("Daily detail covers the last 12 weeks (from "+since+"). Older detail is in the backup file.");
  const pr=(get("progress",{e:[]}).e||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
  L.push("");L.push("WEEKLY AVERAGE WEIGHT, ALL WEEKS (week starting, "+WU+", weigh-ins)");const wa=weekAvgs();if(wa.length)wa.forEach(x=>L.push(x.wk+", "+wOut(x.avg)+", "+x.n));else L.push("No weigh-ins yet");
  L.push("");L.push("BODY, DAILY (date, weight "+WU+", waist cm)");const prr=pr.filter(x=>x.d>=since);
  if(prr.length)prr.forEach(x=>L.push(x.d+", "+(x.w!=null?wOut(x.w):"-")+", "+(x.waist!=null?x.waist:"-")));else L.push("No entries yet");
  L.push("");L.push("LIFTS (completed sets as kg x reps)");
  let any=false;const seen={};
  ORDER.forEach(d=>{const D=DAYS[d];if(D.rest)return;
    ["gym","home"].forEach(m=>{const rows=[];
      D.ex.forEach(e=>{const k="ex-"+e[0]+"-"+m;if(seen[k])return;seen[k]=1;const h=(get(k,{h:[]}).h||[]).filter(x=>x.d>=since&&x.sets.some(s=>s.done));
        if(!h.length)return;
        rows.push(exName(e,m)+" (target "+exTarget(e,m)+")");
        h.forEach(x=>rows.push("  "+x.d+": "+x.sets.filter(s=>s.done).map(s=>(s.w!==""?s.w+"x":"")+s.r).join(", ")))});
      if(rows.length){any=true;L.push("["+DNAME[d]+" "+D.title+", "+m+"]");rows.forEach(r=>L.push(r))}})});
  if(!any)L.push("No sets logged yet");
  const mh=get("mealhist",{}),md=Object.keys(mh).sort();
  L.push("");L.push("MEALS EATEN BY WEEK, ALL WEEKS (week starting, days logged, average kcal, average protein g)");
  const mw={};md.forEach(d=>{const w=mw[mondayOf(parse(d))]=mw[mondayOf(parse(d))]||{n:0,k:0,p:0};w.n++;w.k+=mh[d].k;w.p+=mh[d].p});
  if(md.length)Object.keys(mw).sort().forEach(w=>L.push(w+", "+mw[w].n+", "+Math.round(mw[w].k/mw[w].n)+", "+Math.round(mw[w].p/mw[w].n)));else L.push("No meals ticked yet");
  L.push("");L.push("MEALS EATEN, DAILY (date, kcal of target, protein g of target, what was ticked)");
  md.filter(d=>d>=since).forEach(d=>{const x=mh[d];L.push(d+", "+x.k+" of "+x.tk+", "+x.p+" of "+x.tp+", "+Object.keys(x.ate).map(sl=>(RECIPES[x.ate[sl]]||{}).name||x.ate[sl]).join("; "))});
  L.push("");L.push("CURRENT MENU (lunch / dinner)");ORDER.forEach(d=>L.push(DNAME[d]+": "+RECIPES[choice("lunch",d)].name+" / "+RECIPES[choice("dinner",d)].name+" ("+dayTotals(d).k+" kcal, "+dayTotals(d).p+" g protein with breakfast, shake and treat)"));
  const sh=get("supphist",{});
  L.push("");L.push("SUPPLEMENTS (date, taken)");Object.keys(sh).sort().filter(d=>d>=since&&sh[d].length).forEach(d=>L.push(d+", "+sh[d].join(" ")));
  return L.join("\n");
}
function msg(t){const el=$("#d-msg");if(el)el.textContent=t}
let pendingRestore=null;
$("#view").addEventListener("click",async ev=>{
  const id=ev.target.id;
  if(id==="d-copy"){const text=buildSummary();
    try{await navigator.clipboard.writeText(text);msg("Copied. Paste it into your Claude chat and ask for a review.")}
    catch(e){const ta=$("#d-text");ta.hidden=false;ta.value=text;ta.focus();ta.select();msg("Your phone blocked copying. The text is selected above: long-press and choose Copy.")}
    return}
  if(id==="d-backup"){const data=allData();delete data.backup;
    const blob=new Blob([JSON.stringify({app:P.slug,v:1,exported:TODAY,data:data},null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=P.slug+"-backup-"+TODAY+".json";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);save("backup",TODAY);msg("Backup saved to "+P.backupWhere+" as "+P.slug+"-backup-"+TODAY+".json.");return}
  if(id==="d-restore"){$("#d-file").click();return}
  if(id==="d-apply"&&pendingRestore){
    try{for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&k.indexOf(LS)===0)localStorage.removeItem(k)}}catch(e){}
    Object.keys(cache).forEach(k=>delete cache[k]);
    Object.keys(pendingRestore).forEach(k=>{if(k!=="backup")lsSet(k,pendingRestore[k])});
    pendingRestore=null;render();msg("Restored. Your logs are back.");return}
  if(id==="d-cancel"){pendingRestore=null;render();return}
});
$("#view").addEventListener("change",ev=>{
  if(ev.target.id!=="d-file")return;const f=ev.target.files&&ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if([P.slug].concat(P.legacySlugs||[]).indexOf(j.app)<0||!j.data)throw new Error("x");
      pendingRestore=j.data;const el=$("#d-msg");
      el.innerHTML="Backup from "+esc(fmtDate(j.exported||TODAY))+" found. Restoring replaces everything on this phone. "+
        '<span class="data-btns" style="margin-top:8px"><button type="button" class="btn small" id="d-apply">Replace my data</button><button type="button" class="btn ghost small" id="d-cancel">Cancel</button></span>'}
    catch(e){msg("That file isn’t a "+P.app+" backup. Choose the "+P.slug+"-backup file from "+P.backupWhere+".")}};
  r.onerror=()=>msg("Couldn’t read that file. Try choosing it again.");
  r.readAsText(f);ev.target.value="";
});

render();

// ---------- Offline + install ----------
syncStart();renderTimers();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
})();
</script>
